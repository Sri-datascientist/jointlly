# Nginx Production Configuration for Jointlly on AWS EC2
# Configured for https://jointlly.in (Primary) and https://jointlly.com (Canonical Redirect)

server {
    listen 80;
    listen [::]:80;
    server_name jointlly.in www.jointlly.in jointlly.com www.jointlly.com;
    return 301 https://jointlly.in$request_uri;
}

# Redirect jointlly.com to canonical jointlly.in domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jointlly.com www.jointlly.com www.jointlly.in;

    ssl_certificate /etc/letsencrypt/live/jointlly.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jointlly.in/privkey.pem;

    return 301 https://jointlly.in$request_uri;
}

# Primary Server Block for https://jointlly.in
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jointlly.in;

    root /var/www/jointlly/dist;
    index index.html;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/jointlly.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jointlly.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Production Gzip & Compression for Fast Load Time
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers (HTTP level enforcement for AWS EC2)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Long-Term Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp4|webm|glb)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # XML Sitemap & Robots.txt Direct Serving
    location = /sitemap.xml {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # AI Discovery Files (.well-known/ai.txt and /ai.json)
    location = /.well-known/ai.txt {
        add_header Content-Type text/plain;
    }

    location = /ai.json {
        add_header Content-Type application/json;
    }
}
